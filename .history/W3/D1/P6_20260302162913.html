<body>
    <pre id="out">
    </pre>
    <button id="runBtn" class="px-3 py-1 rounded mt-2 mb-2 bg-black text-white">run</button>
    <script>
        const out = document.getElementById("out");

        function print(...args){
        // console
        console.log(...args);
        out.textContent+=args.join("")+"\n";   
    }
        function clearOut(){
            out.textContent = "";
        }
        function run(){
            clearOut();
            let value = 10
        }
        document.getElementById("runBtn").addEventListener
    ("click",run);
    
    </script>
</body>
